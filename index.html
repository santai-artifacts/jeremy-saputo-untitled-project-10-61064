<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: white;
      margin-bottom: 20px;
      font-size: 2.5em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .game-info {
      display: flex;
      gap: 40px;
      justify-content: center;
      margin-bottom: 20px;
      color: white;
      font-size: 1.2em;
    }

    .score, .highScore {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }

    canvas {
      border: 3px solid white;
      background-color: #1a1a2e;
      display: block;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      margin: 0 auto;
    }

    .controls {
      color: white;
      margin-top: 20px;
      font-size: 0.9em;
      opacity: 0.8;
    }

    .game-over {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      padding: 40px 60px;
      border-radius: 12px;
      text-align: center;
      display: none;
      z-index: 100;
      border: 3px solid #667eea;
    }

    .game-over.show {
      display: block;
    }

    .game-over h2 {
      color: #ff6b6b;
      font-size: 2em;
      margin-bottom: 20px;
    }

    .game-over p {
      color: white;
      font-size: 1.2em;
      margin-bottom: 10px;
    }

    .game-over button {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 1.1em;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .game-over button:hover {
      background: #764ba2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐍 Snake</h1>
    <div class="game-info">
      <div class="score">Score: <span id="score">0</span></div>
      <div class="highScore">High Score: <span id="highScore">0</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
      Use arrow keys or WASD to move • Press Space to pause
    </div>
  </div>

  <div class="game-over" id="gameOverScreen">
    <h2>Game Over!</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let gameOver = false;
    let isPaused = false;

    document.getElementById('highScore').textContent = highScore;

    function generateFood() {
      let newFood;
      let validPosition = false;
      while (!validPosition) {
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        validPosition = !snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
      }
      food = newFood;
    }

    function update() {
      if (gameOver || isPaused) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Check wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        endGame();
        return;
      }

      // Check self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Check food collision
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Clear canvas
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw snake
      ctx.fillStyle = '#ff69b4';
      snake.forEach((segment, index) => {
        const x = segment.x * gridSize;
        const y = segment.y * gridSize;
        ctx.fillRect(x + 1, y + 1, gridSize - 2, gridSize - 2);

        // Head highlight
        if (index === 0) {
          ctx.fillStyle = '#ffb3d9';
          ctx.fillRect(x + 3, y + 3, gridSize - 6, gridSize - 6);
          ctx.fillStyle = '#ff69b4';
        }
      });

      // Draw food
      ctx.fillStyle = '#ff6b6b';
      const foodX = food.x * gridSize;
      const foodY = food.y * gridSize;
      ctx.beginPath();
      ctx.arc(foodX + gridSize / 2, foodY + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameLoop() {
      update();
      draw();
      setTimeout(gameLoop, 100);
    }

    function endGame() {
      gameOver = true;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
        document.getElementById('highScore').textContent = highScore;
      }
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverScreen').classList.add('show');
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (gameOver) return;

      switch (e.key.toLowerCase()) {
        case 'arrowup':
        case 'w':
          if (dy === 0) { nextDx = 0; nextDy = -1; }
          e.preventDefault();
          break;
        case 'arrowdown':
        case 's':
          if (dy === 0) { nextDx = 0; nextDy = 1; }
          e.preventDefault();
          break;
        case 'arrowleft':
        case 'a':
          if (dx === 0) { nextDx = -1; nextDy = 0; }
          e.preventDefault();
          break;
        case 'arrowright':
        case 'd':
          if (dx === 0) { nextDx = 1; nextDy = 0; }
          e.preventDefault();
          break;
        case ' ':
          isPaused = !isPaused;
          e.preventDefault();
          break;
      }
    });

    gameLoop();
  </script>
</body>
</html>
